<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:white;
    text-align:center;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 15px;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,79,160,.08),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(125,70,255,.06),
            transparent 35%
        ),
        #121212;
}


.success-card{
    width:100%;
    max-width:520px;

    background:rgba(28,28,28,.96);

    border:1px solid #3a3a3a;
    border-radius:20px;

    padding:42px 28px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);
}


.heart{
    font-size:44px;
    margin-bottom:14px;
}


h1{
    margin:0;

    font-size:32px;
}


.subtitle{
    margin:14px 0 24px;

    color:#ccc;

    font-size:18px;
}


.message-box{
    background:#111;

    border:1px solid #3a3a3a;

    border-radius:14px;

    padding:20px;

    color:#ddd;

    font-size:15px;

    line-height:1.6;
}


.message-box p{
    margin:0 0 14px;
}


.message-box p:last-child{
    margin-bottom:0;
}


.button{
    display:inline-block;

    margin-top:28px;

    background:#ff4fa0;

    color:white;

    text-decoration:none;

    padding:15px 28px;

    border-radius:11px;

    font-size:16px;

    font-weight:bold;

    transition:
        transform .2s ease,
        opacity .2s ease;
}


.button:hover{
    transform:translateY(-2px);
    opacity:.96;
}


@media(max-width:520px){

    .success-card{
        padding:34px 20px;
    }

    h1{
        font-size:28px;
    }

    .subtitle{
        font-size:16px;
    }

}

</style>

</head>


<body>

<div class="success-card">

    <div class="heart">
        🤍
    </div>

    <h1>
        Thank you!
    </h1>

    <p class="subtitle">
        Your payment was successful.
    </p>


    <div class="message-box">

        <p>
            Thank you so much for your tip and for supporting me in creating more content ♡
        </p>

        <p>
            If you left your email address, I’ll reply within 24 hours to thank you personally and respond to your message.
        </p>

        <p>
            I’ll usually reply sooner when I can.
        </p>

    </div>


    <a
        class="button"
        href="index.html">

        Back to Ember Green

    </a>

</div>

</body>

</html>
