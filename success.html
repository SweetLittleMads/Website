<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,79,160,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(125,70,255,.08),
            transparent 35%
        ),
        #121212;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;
}

.card{
    width:100%;
    max-width:480px;

    background:rgba(28,28,28,.96);

    border:1px solid #3a3a3a;

    border-radius:20px;

    padding:40px 30px;

    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.check{
    font-size:54px;
    margin-bottom:15px;
}

h1{
    margin:0 0 15px;
    font-size:32px;
}

p{
    color:#bbb;
    font-size:17px;
    line-height:1.5;
}

.message{
    margin-top:20px;

    padding:17px;

    background:#121212;

    border:1px solid #333;

    border-radius:12px;

    color:#aaa;

    font-size:14px;
    line-height:1.6;
}

.reply{
    color:#ddd;
    margin-top:10px;
}

.button{
    display:inline-block;

    margin-top:28px;

    background:#ff4fa0;

    color:white;

    text-decoration:none;

    padding:15px 28px;

    border-radius:12px;

    font-weight:bold;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.button:hover{
    opacity:.9;
    transform:translateY(-1px);
}

</style>

</head>


<body>

<div class="card">

<div class="check">
💜
</div>

<h1>
Thank you!
</h1>

<p>
Your payment was successful.
</p>

<div class="message">

Your request / message has been sent directly to me.

<div class="reply">
If you included contact details, Ember will get back to you within 24 hours.
</div>

</div>

<a
    class="button"
    href="index.html">

Back to Ember Green

</a>

</div>

</body>

</html>
