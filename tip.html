<form
    action="https://formsubmit.co/SweetLittleMads@proton.me"
    method="POST">

<!-- Email subject you receive -->
<input
    type="hidden"
    name="_subject"
    value="New SweetLittleMads Tip Request">

<!-- Redirect to Stripe after message is submitted -->
<input
    type="hidden"
    name="_next"
    value="https://buy.stripe.com/8x26oG6SC8ZKaw51ox7kc00">

<!-- Disable FormSubmit captcha -->
<input
    type="hidden"
    name="_captcha"
    value="false">


<label for="amount">
    Enter amount to tip
</label>

<div class="amount-box">

    <span class="currency">£</span>

    <input
        type="number"
        id="amount"
        name="Tip amount"
        min="1"
        step="0.01"
        placeholder="10.00"
        required>

</div>


<label for="message">
    Send your request / message
</label>

<textarea
    id="message"
    name="Request or message"
    maxlength="1000"
    placeholder="Write your request or message here..."
    required></textarea>

<div class="helper">
    Your message will be sent directly to me.
</div>


<label for="name">
    Your name
</label>

<input
    type="text"
    id="name"
    name="Name"
    maxlength="60"
    placeholder="Anonymous">


<label for="email">
    Email (if you'd like a reply)
</label>

<input
    type="email"
    id="email"
    name="Email for reply"
    placeholder="you@example.com">

<div class="helper">
    Optional — only enter this if you'd like me to reply.
</div>


<button class="pay-button" type="submit">
    Continue to Payment
</button>

</form>
