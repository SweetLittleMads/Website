<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SweetLittleMads</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

.container{
    max-width:800px;
    width:90%;
    margin:auto;
    padding:50px 20px;
}

h1{
    font-size:48px;
    margin:0 0 10px;
}

p{
    font-size:20px;
    color:#cccccc;
}

/* TIP BUTTON */

.button{
    display:inline-block;
    margin-top:25px;
    background:#ff4fa0;
    color:white;
    text-decoration:none;
    padding:18px 40px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:transform .2s ease, opacity .2s ease;
}

.button:hover{
    opacity:.9;
    transform:translateY(-2px);
}

.small-text{
    font-size:14px;
    color:#888;
    margin-top:18px;
}


/* FEATURED ONLYFANS */

.featured-card{
    margin:45px auto 0;
    max-width:420px;
}

.featured-link{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:98px;
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:16px;
    padding:18px 20px;
    color:white;
    text-decoration:none;
    transition:transform .2s ease, background .2s ease;
}

.featured-link:hover{
    transform:translateY(-2px);
    background:#242424;
}

.featured-title{
    font-size:22px;
    font-weight:bold;
}

.featured-subtitle{
    margin-top:6px;
    color:#aaa;
    font-size:15px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:10px;
    margin:15px auto 0;
    max-width:420px;
}

.social-button{
    flex:1;
    min-width:0;
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#1c1c1c;
    border:1px solid #333;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    transition:transform .2s ease, background .2s ease;
}

.social-button:hover{
    transform:translateY(-2px);
    background:#242424;
}

.reddit-mini-avatar{
    width:38px;
    height:38px;
    object-fit:contain;
    flex-shrink:0;
}


/* TWITCH */

.twitch-section{
    margin-top:60px;
}

.twitch-section h2{
    margin-bottom:20px;
}

.twitch-wrapper{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
}

.twitch-wrapper iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;
        padding:35px 12px;
    }

    h1{
        font-size:36px;
    }

    .button{
        width:100%;
        max-width:320px;
    }

    .social-links{
        gap:7px;
    }

    .social-button{
        font-size:13px;
        padding:8px 5px;
    }

    .reddit-mini-avatar{
        width:32px;
        height:32px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>SweetLittleMads</h1>

<p>💜 Support my content</p>

<p>Your support helps me continue creating content. Thank you!</p>


<!-- TIP -->

<a class="button" href="tip.html">
    Leave a Tip
</a>

<p class="small-text">
    All digital purchases are non-refundable.
</p>


<!-- ONLYFANS FEATURED -->

<div class="featured-card">

<a class="featured-link"
   href="https://onlyfans.com/sweetlittlemads"
   target="_blank"
   rel="noopener noreferrer">

    <div>
        <div class="featured-title">OnlyFans</div>
        <div class="featured-subtitle">Exclusive content →</div>
    </div>

</a>

</div>


<!-- SOCIAL LINKS -->

<div class="social-links">

    <a class="social-button"
       href="https://www.reddit.com/user/SweetLilMads/"
       target="_blank"
       rel="noopener noreferrer">

        <img
            class="reddit-mini-avatar"
            src="reddit-avatar.png"
            alt="SweetLittleMads Reddit avatar">

        <span>Reddit</span>

    </a>


    <a class="social-button"
       href="https://x.com/sweetlittlemads"
       target="_blank"
       rel="noopener noreferrer">
        X
    </a>


    <a class="social-button"
       href="https://www.instagram.com/sweetlittlemads"
       target="_blank"
       rel="noopener noreferrer">
        Instagram
    </a>

</div>


<!-- TWITCH -->

<div class="twitch-section">

<h2>🎥 Live on Twitch</h2>

<div class="twitch-wrapper">

<iframe
    src="https://player.twitch.tv/?channel=sweetlittlemads&parent=sweetlittlemads.co.uk"
    allowfullscreen>
</iframe>

</div>

</div>


</div>

</body>
</html>
