<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SweetLittleMads</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

.container{
    max-width:800px;
    width:90%;
    margin:auto;
    padding:50px 20px;
}

h1{
    font-size:48px;
    margin:0 0 10px;
}

p{
    font-size:20px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:25px;
    background:#ff4fa0;
    color:white;
    text-decoration:none;
    padding:18px 40px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:transform .2s ease, opacity .2s ease;
}

.button:hover{
    opacity:.9;
    transform:translateY(-2px);
}

.small-text{
    font-size:14px;
    color:#888;
    margin-top:18px;
}

/* REDDIT */

.reddit-card{
    margin:45px auto 0;
    max-width:420px;
}

.reddit-link{
    display:flex;
    align-items:center;
    gap:18px;
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:16px;
    padding:15px 20px;
    color:white;
    text-decoration:none;
    text-align:left;
    transition:transform .2s ease, background .2s ease;
}

.reddit-link:hover{
    transform:translateY(-2px);
    background:#242424;
}

.reddit-avatar{
    width:68px;
    height:68px;
    object-fit:contain;
    flex-shrink:0;
}

.reddit-title{
    font-size:20px;
    font-weight:bold;
}

.reddit-name{
    margin-top:5px;
    color:#aaa;
    font-size:15px;
}

/* TWITCH */

.twitch-section{
    margin-top:60px;
}

.twitch-section h2{
    margin-bottom:20px;
}

.twitch-wrapper{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
}

.twitch-wrapper iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
}

@media(max-width:600px){

    .container{
        width:94%;
        padding:35px 12px;
    }

    h1{
        font-size:36px;
    }

    .button{
        width:100%;
        max-width:320px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>SweetLittleMads</h1>

<p>💜 Support my content</p>

<p>Your support helps me continue creating content. Thank you!</p>

<a class="button" href="tip.html">
    Leave a Tip
</a>

<p class="small-text">
    All digital purchases are non-refundable.
</p>


<!-- REDDIT -->

<div class="reddit-card">

<a class="reddit-link"
   href="https://www.reddit.com/user/SweetLilMads/"
   target="_blank"
   rel="noopener noreferrer">

    <img
        class="reddit-avatar"
        src="reddit-avatar.png"
        alt="SweetLittleMads Reddit avatar">

    <div>
        <div class="reddit-title">Reddit</div>
        <div class="reddit-name">u/SweetLilMads</div>
    </div>

</a>

</div>


<!-- TWITCH -->

<div class="twitch-section">

<h2>🎥 Live on Twitch</h2>

<div class="twitch-wrapper">

<iframe
    src="https://player.twitch.tv/?channel=sweetlittlemads&parent=sweetlittlemads.co.uk"
    allowfullscreen>
</iframe>

</div>

</div>

</div>

</body>
</html>
