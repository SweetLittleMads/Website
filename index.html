<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:white;
    text-align:center;

    background:
        radial-gradient(
            ellipse at 12% 18%,
            rgba(255,72,30,.22),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 88% 20%,
            rgba(30,220,115,.20),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 50% 105%,
            rgba(25,110,70,.14),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #080907 0%,
            #0c1210 42%,
            #090c0a 70%,
            #050606 100%
        );

    background-attachment:fixed;

    position:relative;
}


/* SUBTLE BACKGROUND TEXTURE */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.012) 0px,
            rgba(255,255,255,.012) 1px,
            transparent 1px,
            transparent 10px
        );

    opacity:.6;
}


/* MAIN CONTAINER */

.container{
    position:relative;
    z-index:1;

    max-width:800px;
    width:90%;

    margin:auto;

    padding:65px 20px;
}


/* TITLE */

h1{
    font-size:54px;

    margin:0 0 14px;

    font-weight:900;

    letter-spacing:-1.5px;
}


/* EMBER */

.ember-text{

    background:
        linear-gradient(
            180deg,
            #fff1b0 0%,
            #ffc048 15%,
            #ff7a2e 38%,
            #f13d20 62%,
            #a90f0b 83%,
            #5c0806 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 3px
            rgba(255,210,100,.7)
        )
        drop-shadow(
            0 0 9px
            rgba(255,80,30,.5)
        )
        drop-shadow(
            0 0 20px
            rgba(210,25,10,.3)
        );
}


/* GREEN */

.green-text{

    background:
        linear-gradient(
            180deg,
            #d9ffe9 0%,
            #8affb8 16%,
            #39e785 38%,
            #12b961 62%,
            #08763d 82%,
            #034724 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 3px
            rgba(150,255,190,.65)
        )
        drop-shadow(
            0 0 9px
            rgba(40,220,115,.45)
        )
        drop-shadow(
            0 0 20px
            rgba(10,145,70,.28)
        );
}


p{
    font-size:20px;
    color:#ccc;
}


/* SUPPORT */

.support-line{
    color:#eee;
}

.white-heart{
    color:white;
}


/* TIP BUTTON */

.button{
    display:inline-block;

    margin-top:25px;

    background:
        linear-gradient(
            135deg,
            #ff7138,
            #e83d24,
            #b71f15
        );

    color:white;

    text-decoration:none;

    padding:18px 42px;

    border-radius:13px;

    font-size:22px;
    font-weight:bold;

    border:
        1px solid
        rgba(255,135,85,.45);

    box-shadow:
        0 0 0 1px rgba(255,80,35,.08),
        0 8px 30px rgba(230,55,25,.22);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 18px rgba(255,85,35,.20),
        0 12px 36px rgba(230,55,25,.30);
}


.small-text{
    font-size:14px;

    color:#777;

    margin-top:18px;
}


/* ONLYFANS */

.featured-card{
    margin:45px auto 0;

    max-width:420px;
}


.featured-link{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:98px;

    background:
        linear-gradient(
            145deg,
            rgba(21,27,24,.95),
            rgba(13,18,16,.95)
        );

    border:
        1px solid
        rgba(55,215,125,.24);

    border-radius:16px;

    padding:18px 20px;

    color:white;

    text-decoration:none;

    backdrop-filter:blur(8px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.featured-link:hover{
    transform:translateY(-2px);

    border-color:
        rgba(65,235,140,.55);

    box-shadow:
        0 0 22px rgba(35,200,105,.08),
        0 10px 30px rgba(0,0,0,.25);
}


.featured-title{
    font-size:22px;

    font-weight:bold;
}


.featured-subtitle{
    margin-top:6px;

    color:#aaa;

    font-size:15px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;

    gap:10px;

    margin:15px auto 0;

    max-width:420px;
}


.social-button{
    flex:1;

    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
        linear-gradient(
            145deg,
            rgba(21,27,24,.95),
            rgba(13,18,16,.95)
        );

    border:
        1px solid #34443b;

    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.social-button:hover{
    transform:translateY(-2px);

    border-color:#527060;

    box-shadow:
        0 8px 26px rgba(0,0,0,.25);
}


/* REDDIT AVATAR */

.reddit-mini-avatar{
    width:38px;
    height:38px;

    object-fit:contain;

    flex-shrink:0;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;

        padding:45px 12px;
    }


    h1{
        font-size:41px;
    }


    p{
        font-size:17px;
    }


    .button{
        width:100%;

        max-width:320px;
    }


    .social-links{
        gap:8px;
    }


    .social-button{
        font-size:14px;

        padding:9px 8px;
    }


    .reddit-mini-avatar{
        width:34px;
        height:34px;
    }

}

</style>

</head>


<body>

<div class="container">


<h1>

    <span class="ember-text">
        Ember
    </span>

    <span class="green-text">
        Green
    </span>

</h1>


<p class="support-line">

    <span class="white-heart">
        🤍
    </span>

    Support my content

</p>


<p>
Your support helps me continue creating content. Thank you!
</p>



<a
    class="button"
    href="tip.html">

    Leave a Tip

</a>


<p class="small-text">
All digital purchases are non-refundable.
</p>



<div class="featured-card">

<a
    class="featured-link"
    href="https://onlyfans.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    <div>

        <div class="featured-title">
            OnlyFans
        </div>

        <div class="featured-subtitle">
            Exclusive content →
        </div>

    </div>

</a>

</div>



<div class="social-links">


<a
    class="social-button"
    href="https://www.reddit.com/user/-EmberGreen-/"
    target="_blank"
    rel="noopener noreferrer">

    <img
        class="reddit-mini-avatar"
        src="reddit-avatar.png"
        alt="Ember Green Reddit avatar">

    <span>
        Reddit
    </span>

</a>



<a
    class="social-button"
    href="https://x.com/EmberGreenX"
    target="_blank"
    rel="noopener noreferrer">

    X

</a>


</div>


</div>

</body>

</html>
