<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:white;
    text-align:center;

    background:
        radial-gradient(
            ellipse at 12% 18%,
            rgba(190,65,35,.17),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 88% 20%,
            rgba(40,125,75,.16),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 50% 105%,
            rgba(25,80,55,.12),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #080907 0%,
            #0c1210 42%,
            #090c0a 70%,
            #050606 100%
        );

    background-attachment:fixed;

    position:relative;
}


/* SUBTLE BACKGROUND TEXTURE */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.010) 0px,
            rgba(255,255,255,.010) 1px,
            transparent 1px,
            transparent 10px
        );

    opacity:.5;
}


/* MAIN CONTAINER */

.container{
    position:relative;
    z-index:1;

    max-width:800px;
    width:90%;

    margin:auto;

    padding:65px 20px;
}


/* EMBER GREEN LOGO */

h1{
    font-family:Georgia, "Times New Roman", serif;

    font-size:56px;
    font-weight:700;

    margin:0 0 16px;

    letter-spacing:-1px;
}


/* EMBER */

.ember-text{
    background:
        linear-gradient(
            180deg,
            #ffd38a 0%,
            #e98945 32%,
            #c84b32 67%,
            #8f2922 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 5px
            rgba(210,85,45,.20)
        );
}


/* GREEN */

.green-text{
    background:
        linear-gradient(
            180deg,
            #a9d6b5 0%,
            #65ad79 32%,
            #397a51 68%,
            #245238 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 5px
            rgba(55,125,80,.18)
        );
}


p{
    font-size:20px;
    color:#ccc;
}


/* SUPPORT */

.support-line{
    color:#eee;
    margin-bottom:18px;
}

.white-heart{
    color:white;
}

.support-description{
    margin-top:0;
}


/* TIP BUTTON */

.button{
    display:inline-block;

    margin-top:25px;

    background:
        linear-gradient(
            135deg,
            #d9683e,
            #b84631
        );

    /* GREEN TEXT */
    color:#b6e3c1;

    text-decoration:none;

    padding:18px 42px;

    border-radius:13px;

    font-size:22px;
    font-weight:700;

    border:
        1px solid
        rgba(220,110,70,.35);

    box-shadow:
        0 8px 30px
        rgba(170,55,35,.18);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}


.button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 32px
        rgba(190,65,40,.30);

    opacity:.97;
}


/* REQUEST MESSAGE */

.request-text{
    margin:15px 0 0;

    font-size:15px;

    color:#a9d6b5;

    font-weight:600;
}


.small-text{
    font-size:13px;

    color:#777;

    margin-top:8px;
}


/* ONLYFANS */

.featured-card{
    margin:40px auto 0;

    max-width:420px;
}


.featured-link{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:98px;

    background:
        linear-gradient(
            145deg,
            rgba(21,27,24,.95),
            rgba(13,18,16,.95)
        );

    border:
        1px solid
        rgba(80,145,100,.25);

    border-radius:16px;

    padding:18px 20px;

    color:white;

    text-decoration:none;

    backdrop-filter:blur(8px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.featured-link:hover{
    transform:translateY(-2px);

    border-color:
        rgba(95,165,115,.50);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
}


.featured-title{
    font-size:22px;

    font-weight:bold;
}


.featured-subtitle{
    margin-top:6px;

    color:#aaa;

    font-size:15px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;

    gap:10px;

    margin:15px auto 0;

    max-width:420px;
}


.social-button{
    flex:1;

    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
        linear-gradient(
            145deg,
            rgba(21,27,24,.95),
            rgba(13,18,16,.95)
        );

    border:
        1px solid #34443b;

    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.social-button:hover{
    transform:translateY(-2px);

    border-color:#527060;

    box-shadow:
        0 8px 26px
        rgba(0,0,0,.25);
}


/* REDDIT AVATAR */

.reddit-mini-avatar{
    width:38px;
    height:38px;

    object-fit:cover;

    border-radius:50%;

    flex-shrink:0;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;

        padding:45px 12px;
    }


    h1{
        font-size:42px;
    }


    p{
        font-size:17px;
    }


    .button{
        width:100%;

        max-width:320px;
    }


    .request-text{
        font-size:14px;
    }


    .small-text{
        font-size:12px;
    }


    .social-links{
        gap:8px;
    }


    .social-button{
        font-size:14px;

        padding:9px 8px;
    }


    .reddit-mini-avatar{
        width:34px;
        height:34px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- EMBER GREEN -->

<h1>

    <span class="ember-text">
        Ember
    </span>

    <span class="green-text">
        Green
    </span>

</h1>


<!-- SUPPORT -->

<p class="support-line">

    <span class="white-heart">
        🤍
    </span>

    Support my content

</p>


<p class="support-description">
Your support helps me continue creating content. Thank you!
</p>



<!-- TIP -->

<a
    class="button"
    href="tip.html">

    Leave a Tip

</a>


<p class="request-text">
Personal requests answered within 24 hours
</p>


<p class="small-text">
All digital purchases are non-refundable.
</p>



<!-- ONLYFANS -->

<div class="featured-card">

<a
    class="featured-link"
    href="https://onlyfans.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    <div>

        <div class="featured-title">
            OnlyFans
        </div>

        <div class="featured-subtitle">
            Exclusive content →
        </div>

    </div>

</a>

</div>



<!-- SOCIAL LINKS -->

<div class="social-links">


<!-- REDDIT -->

<a
    class="social-button"
    href="https://www.reddit.com/user/_EmberGreen_/"
    target="_blank"
    rel="noopener noreferrer">

    <img
        class="reddit-mini-avatar"
        src="reddit-avatar.png"
        alt="Ember Green Reddit avatar">

    <span>
        Reddit
    </span>

</a>



<!-- X -->

<a
    class="social-button"
    href="https://x.com/EmberGreenX"
    target="_blank"
    rel="noopener noreferrer">

    <span>
        X
    </span>

</a>


</div>


</div>

</body>

</html>
