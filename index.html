<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 18% 18%,
            rgba(255,80,35,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 82% 22%,
            rgba(35,190,110,.14),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(20,120,75,.10),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #07100d 0%,
            #101513 45%,
            #080a09 100%
        );

    background-attachment:fixed;

    color:white;
    text-align:center;
}


/* MAIN CONTAINER */

.container{
    max-width:800px;
    width:90%;

    margin:auto;

    padding:55px 20px;
}


/* TITLE */

h1{
    font-size:52px;

    margin:0 0 12px;

    font-weight:800;

    letter-spacing:-1px;
}


/* FIERY EMBER TEXT */

.ember-text{

    background:
        linear-gradient(
            180deg,
            #fff4c7 0%,
            #ffc15c 15%,
            #ff7a32 38%,
            #f04427 62%,
            #a91912 82%,
            #67100d 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 3px
            rgba(255,190,80,.55)
        )
        drop-shadow(
            0 0 8px
            rgba(255,85,35,.40)
        )
        drop-shadow(
            0 0 15px
            rgba(220,40,20,.25)
        );
}


/* GREEN TEXT */

.green-text{
    color:#39d98a;

    text-shadow:
        0 0 8px
        rgba(57,217,138,.25),
        0 0 18px
        rgba(57,217,138,.12);
}


p{
    font-size:20px;
    color:#cccccc;
}


/* SUPPORT LINE */

.support-line{
    color:#e8e8e8;
}

.white-heart{
    color:white;
}


/* TIP BUTTON */

.button{
    display:inline-block;

    margin-top:25px;

    background:
        linear-gradient(
            135deg,
            #ff6538,
            #d93624
        );

    color:white;

    text-decoration:none;

    padding:18px 40px;

    border-radius:12px;

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 8px 30px
        rgba(255,80,40,.18);

    transition:
        transform .2s ease,
        opacity .2s ease,
        box-shadow .2s ease;
}


.button:hover{
    opacity:.96;

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 35px
        rgba(255,80,40,.30);
}


.small-text{
    font-size:14px;

    color:#888;

    margin-top:18px;
}


/* FEATURED ONLYFANS */

.featured-card{
    margin:45px auto 0;

    max-width:420px;
}


.featured-link{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:98px;

    background:
        rgba(18,24,21,.92);

    border:
        1px solid
        rgba(57,217,138,.20);

    border-radius:16px;

    padding:18px 20px;

    color:white;

    text-decoration:none;

    backdrop-filter:
        blur(8px);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.featured-link:hover{
    transform:
        translateY(-2px);

    background:#17201c;

    border-color:
        rgba(57,217,138,.50);

    box-shadow:
        0 8px 30px
        rgba(57,217,138,.08);
}


.featured-title{
    font-size:22px;

    font-weight:bold;
}


.featured-subtitle{
    margin-top:6px;

    color:#aaa;

    font-size:15px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;
    align-items:stretch;

    gap:10px;

    margin:15px auto 0;

    max-width:420px;
}


.social-button{
    flex:1;

    min-width:0;
    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    background:
        rgba(18,24,21,.92);

    border:
        1px solid #334039;

    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    backdrop-filter:
        blur(8px);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.social-button:hover{
    transform:
        translateY(-2px);

    background:#17201c;

    border-color:#4f6a5c;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}


/* REDDIT AVATAR */

.reddit-mini-avatar{
    width:38px;
    height:38px;

    object-fit:contain;

    flex-shrink:0;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;

        padding:40px 12px;
    }


    h1{
        font-size:40px;
    }


    p{
        font-size:17px;
    }


    .button{
        width:100%;

        max-width:320px;
    }


    .social-links{
        gap:8px;
    }


    .social-button{
        font-size:14px;

        padding:9px 8px;
    }


    .reddit-mini-avatar{
        width:34px;
        height:34px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- TITLE -->

<h1>

    <span class="ember-text">
        Ember
    </span>

    <span class="green-text">
        Green
    </span>

</h1>


<!-- SUPPORT -->

<p class="support-line">

    <span class="white-heart">
        🤍
    </span>

    Support my content

</p>


<p>
Your support helps me continue creating content. Thank you!
</p>



<!-- TIP -->

<a
    class="button"
    href="tip.html">

    Leave a Tip

</a>


<p class="small-text">
All digital purchases are non-refundable.
</p>



<!-- ONLYFANS -->

<div class="featured-card">

<a
    class="featured-link"
    href="https://onlyfans.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    <div>

        <div class="featured-title">
            OnlyFans
        </div>

        <div class="featured-subtitle">
            Exclusive content →
        </div>

    </div>

</a>

</div>



<!-- SOCIAL LINKS -->

<div class="social-links">


<!-- REDDIT -->

<a
    class="social-button"
    href="https://www.reddit.com/user/-EmberGreen-/"
    target="_blank"
    rel="noopener noreferrer">

    <img
        class="reddit-mini-avatar"
        src="reddit-avatar.png"
        alt="Ember Green Reddit avatar">

    <span>
        Reddit
    </span>

</a>



<!-- X -->

<a
    class="social-button"
    href="https://x.com/EmberGreenX"
    target="_blank"
    rel="noopener noreferrer">

    <span>
        X
    </span>

</a>


</div>


</div>

</body>

</html>
