<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,79,160,.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 15% 65%,
            rgba(125,70,255,.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255,79,160,.07),
            transparent 30%
        ),
        #121212;

    background-attachment:fixed;

    color:white;
    text-align:center;
}


/* MAIN CONTAINER */

.container{
    max-width:800px;
    width:90%;
    margin:auto;
    padding:50px 20px;
}


/* TITLE */

h1{
    font-size:48px;
    margin:0 0 10px;
}

p{
    font-size:20px;
    color:#cccccc;
}


/* TIP BUTTON */

.button{
    display:inline-block;

    margin-top:25px;

    background:#ff4fa0;
    color:white;

    text-decoration:none;

    padding:18px 40px;

    border-radius:12px;

    font-size:22px;
    font-weight:bold;

    box-shadow:0 8px 30px rgba(255,79,160,.15);

    transition:
        transform .2s ease,
        opacity .2s ease,
        box-shadow .2s ease;
}

.button:hover{
    opacity:.95;
    transform:translateY(-2px);

    box-shadow:0 10px 35px rgba(255,79,160,.25);
}

.small-text{
    font-size:14px;
    color:#888;
    margin-top:18px;
}


/* FEATURED ONLYFANS */

.featured-card{
    margin:45px auto 0;
    max-width:420px;
}

.featured-link{
    display:flex;
    align-items:center;
    justify-content:center;

    min-height:98px;

    background:rgba(28,28,28,.90);

    border:1px solid #3a3a3a;

    border-radius:16px;

    padding:18px 20px;

    color:white;
    text-decoration:none;

    backdrop-filter:blur(8px);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.featured-link:hover{
    transform:translateY(-2px);

    background:#242424;

    border-color:#555;
}

.featured-title{
    font-size:22px;
    font-weight:bold;
}

.featured-subtitle{
    margin-top:6px;
    color:#aaa;
    font-size:15px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;
    align-items:stretch;

    gap:10px;

    margin:15px auto 0;

    max-width:420px;
}

.social-button{
    flex:1;
    min-width:0;
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    background:rgba(28,28,28,.90);

    border:1px solid #3a3a3a;

    color:white;

    text-decoration:none;

    padding:10px;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    backdrop-filter:blur(8px);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.social-button:hover{
    transform:translateY(-2px);

    background:#242424;

    border-color:#555;
}


/* REDDIT AVATAR */

.reddit-mini-avatar{
    width:38px;
    height:38px;

    object-fit:contain;

    flex-shrink:0;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;
        padding:35px 12px;
    }

    h1{
        font-size:36px;
    }

    p{
        font-size:17px;
    }

    .button{
        width:100%;
        max-width:320px;
    }

    .social-links{
        gap:7px;
    }

    .social-button{
        font-size:13px;
        padding:8px 5px;
    }

    .reddit-mini-avatar{
        width:32px;
        height:32px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- TITLE -->

<h1>Ember Green</h1>

<p>
💜 Support my content
</p>

<p>
Your support helps me continue creating content. Thank you!
</p>


<!-- TIP -->

<a
    class="button"
    href="tip.html">

    Leave a Tip

</a>

<p class="small-text">
All digital purchases are non-refundable.
</p>



<!-- ONLYFANS -->

<div class="featured-card">

<a
    class="featured-link"
    href="https://onlyfans.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    <div>

        <div class="featured-title">
            OnlyFans
        </div>

        <div class="featured-subtitle">
            Exclusive content →
        </div>

    </div>

</a>

</div>



<!-- SOCIAL LINKS -->

<div class="social-links">


<!-- REDDIT -->

<a
    class="social-button"
    href="https://www.reddit.com/user/SweetLilMads/"
    target="_blank"
    rel="noopener noreferrer">

    <img
        class="reddit-mini-avatar"
        src="reddit-avatar.png"
        alt="Ember Green Reddit avatar">

    <span>
        Reddit
    </span>

</a>



<!-- X -->

<a
    class="social-button"
    href="https://x.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    X

</a>



<!-- INSTAGRAM -->

<a
    class="social-button"
    href="https://www.instagram.com/sweetlittlemads"
    target="_blank"
    rel="noopener noreferrer">

    Instagram

</a>


</div>


</div>

</body>

</html>
