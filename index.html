<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetLittleMads</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#121212;
    color:white;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    text-align:center;
}

.container{
    max-width:800px;
    width:90%;
    padding:50px 20px;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    font-size:20px;
    color:#cccccc;
}

.button{
    display:inline-block;
    margin-top:35px;
    background:#ff4fa0;
    color:white;
    text-decoration:none;
    padding:18px 40px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:opacity 0.2s ease;
}

.button:hover{
    opacity:0.9;
}

.small-text{
    font-size:14px;
    color:#888;
    margin-top:20px;
}

.twitch-section{
    margin-top:60px;
}

.twitch-section h2{
    margin-bottom:20px;
}

.twitch-wrapper{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:12px;
    overflow:hidden;
}

.twitch-wrapper iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
}
</style>

</head>

<div class="container">

<h1>SweetLittleMads</h1>

All digital purchases are non-refundable.
</p>

<div class="twitch-section">

<h2>🎥 Live on Twitch</h2>

<div class="twitch-wrapper">

<iframe
src="https://player.twitch.tv/?channel=sweetlittlemads&parent=sweetlittlemads.co.uk"
allowfullscreen>
</iframe>

</div>

</div>

</div>

</html>
