<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ember Green</title>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:white;
    text-align:center;

    background:
        radial-gradient(
            ellipse at 12% 18%,
            rgba(190,65,35,.17),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 88% 20%,
            rgba(40,125,75,.16),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 50% 105%,
            rgba(25,80,55,.12),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #080907 0%,
            #0c1210 42%,
            #090c0a 70%,
            #050606 100%
        );

    background-attachment:fixed;

    position:relative;
}


/* SUBTLE BACKGROUND TEXTURE */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.010) 0px,
            rgba(255,255,255,.010) 1px,
            transparent 1px,
            transparent 10px
        );

    opacity:.5;
}


/* MAIN CONTAINER */

.container{
    position:relative;
    z-index:1;

    max-width:800px;
    width:90%;

    margin:auto;

    padding:65px 20px;
}


/* EMBER GREEN LOGO */

h1{
    font-family:Georgia, "Times New Roman", serif;

    font-size:56px;
    font-weight:700;

    margin:0 0 16px;

    letter-spacing:-1px;
}


/* EMBER */

.ember-text{
    background:
        linear-gradient(
            180deg,
            #ffd38a 0%,
            #e98945 32%,
            #c84b32 67%,
            #8f2922 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 5px
            rgba(210,85,45,.20)
        );
}


/* GREEN */

.green-text{
    background:
        linear-gradient(
            180deg,
            #a9d6b5 0%,
            #65ad79 32%,
            #397a51 68%,
            #245238 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
    color:transparent;

    filter:
        drop-shadow(
            0 0 5px
            rgba(55,125,80,.18)
        );
}


p{
    font-size:20px;
    color:#ccc;
}


/* SUPPORT */

.support-line{
    color:#eee;

    margin-bottom:18px;
}

.white-heart{
    color:white;
}

.support-description{
    margin-top:0;
}


/* TIP BUTTON */

.button{
    display:inline-block;

    margin-top:25px;

    background:
        linear-gradient(
            135deg,
            #d9683e,
            #b84631
        );

    color:#b6e3c1;

    text-decoration:none;

    padding:18px 42px;

    border-radius:13px;

    font-size:22px;
    font-weight:700;

    border:
        1px solid
        rgba(220,110,70,.35);

    box-shadow:
        0 8px 30px
        rgba(170,55,35,.18);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}


.button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 32px
        rgba(190,65,40,.30);

    opacity:.97;
}


/* TIP MESSAGE */

.request-text{
    margin:15px 0 0;

    font-size:15px;

    color:#a9d6b5;

    font-weight:600;
}


.small-text{
    font-size:13px;

    color:#777;

    margin-top:8px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;

    gap:12px;

    margin:40px auto 0;

    max-width:420px;
}


.social-button{
    flex:1;

    min-height:70px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    background:
        linear-gradient(
            145deg,
            rgba(21,27,24,.95),
            rgba(13,18,16,.95)
        );

    border:
        1px solid #34443b;

    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.social-button:hover{
    transform:translateY(-2px);

    border-color:#527060;

    box-shadow:
        0 8px 26px
        rgba(0,0,0,.25);
}


/* REDDIT AVATAR */

.reddit-mini-avatar{
    width:38px;
    height:38px;

    object-fit:cover;

    border-radius:50%;

    flex-shrink:0;
}


/* YOUTUBE ICON */

.youtube-icon{
    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;
}


.youtube-icon svg{
    width:38px;
    height:38px;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;

        padding:45px 12px;
    }


    h1{
        font-size:42px;
    }


    p{
        font-size:17px;
    }


    .button{
        width:100%;

        max-width:320px;
    }


    .request-text{
        font-size:14px;
    }


    .small-text{
        font-size:12px;
    }


    .social-links{
        gap:8px;
    }


    .social-button{
        font-size:14px;

        padding:9px 8px;
    }


    .reddit-mini-avatar{
        width:34px;
        height:34px;
    }


    .youtube-icon{
        width:34px;
        height:34px;
    }


    .youtube-icon svg{
        width:34px;
        height:34px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- EMBER GREEN -->

<h1>

    <span class="ember-text">
        Ember
    </span>

    <span class="green-text">
        Green
    </span>

</h1>


<!-- SUPPORT -->

<p class="support-line">

    <span class="white-heart">
        🤍
    </span>

    Support my content

</p>


<p class="support-description">
    Thank you for your support and tips ♡
</p>



<!-- TIP -->

<a
    class="button"
    href="tip.html">

    Leave a Tip

</a>


<p class="request-text">
    Tip messages are replied to within 24 hours
</p>


<p class="small-text">
    All tips are non-refundable.
</p>



<!-- SOCIAL LINKS -->

<div class="social-links">


<!-- YOUTUBE -->

<a
    class="social-button"
    href="https://www.youtube.com/@EmberGreenYT"
    target="_blank"
    rel="noopener noreferrer">

    <span class="youtube-icon">

        <svg viewBox="0 0 48 48" aria-hidden="true">

            <rect
                x="4"
                y="10"
                width="40"
                height="28"
                rx="9"
                fill="#FF0033">
            </rect>

            <polygon
                points="20,17 20,31 32,24"
                fill="white">
            </polygon>

        </svg>

    </span>

    <span>
        YouTube
    </span>

</a>



<!-- REDDIT -->

<a
    class="social-button"
    href="https://www.reddit.com/user/_EmberGreen_/"
    target="_blank"
    rel="noopener noreferrer">

    <img
        class="reddit-mini-avatar"
        src="reddit-avatar.png"
        alt="Ember Green Reddit avatar">

    <span>
        Reddit
    </span>

</a>


</div>


</div>

</body>

</html>
